    r = "serifless"
    lower-delta = "rounded"
    lower-iota = "serifed-semi-tailed"
    lower-tau = "semi-tailed"
    asterisk = "penta-mid"
    brace = "curly-flat-boundary"
    at = "threefold"

    [buildPlans.IosevkaTerm.variants.italic]
